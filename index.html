<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <style>
    /* ── Reset & Variables ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #4f6ef7;
      --primary-hover: #3b5de7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #1e293b;
      --muted: #94a3b8;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,.06);
      --transition: .2s ease;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    /* ── Container ── */
    .app {
      width: 100%;
      max-width: 540px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 4px;
      font-size: .95rem;
    }

    /* ── Input Area ── */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 14px 18px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color var(--transition);
      background: var(--card);
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .input-row button {
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      white-space: nowrap;
    }

    .input-row button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filters button {
      flex: 1;
      padding: 10px;
      font-size: .85rem;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all var(--transition);
    }

    .filters button.active {
      border-color: var(--primary);
      color: var(--primary);
      background: #eef2ff;
    }

    .filters button:hover:not(.active) {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ── Task List ── */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform var(--transition), opacity var(--transition);
      animation: slideIn .3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item.removing {
      animation: slideOut .3s ease forwards;
    }

    @keyframes slideOut {
      to { opacity: 0; transform: translateX(40px); }
    }

    /* Custom Checkbox */
    .task-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      min-width: 24px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: all var(--transition);
    }

    .task-item input[type="checkbox"]:checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .task-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .task-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      transition: all var(--transition);
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all var(--transition);
      line-height: 1;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: #fef2f2;
    }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }

    .empty .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: .95rem;
    }

    /* ── Footer Stats ── */
    .stats {
      text-align: center;
      margin-top: 24px;
      font-size: .85rem;
      color: var(--muted);
    }

    .clear-completed {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
      font-size: .85rem;
      margin-left: 8px;
      transition: color var(--transition);
    }

    .clear-completed:hover {
      color: var(--danger-hover);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📝 To-Do</h1>
      <p>Stay organized, get things done.</p>
    </header>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autofocus />
      <button onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    // ── State ──
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    // ── DOM refs ──
    const input    = document.getElementById('taskInput');
    const list     = document.getElementById('taskList');
    const statsEl  = document.getElementById('stats');

    // ── Add Task ──
    function addTask() {
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    // Enter key support
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // ── Toggle Done ──
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      save();
      render();
    }

    // ── Delete Task ──
    function deleteTask(id) {
      const el = document.querySelector(`[data-id="${id}"]`);
      if (el) {
        el.classList.add('removing');
        el.addEventListener('animationend', () => {
          tasks = tasks.filter(t => t.id !== id);
          save();
          render();
        });
      }
    }

    // ── Clear Completed ──
    function clearCompleted() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    // ── Filters ──
    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.filters .active').classList.remove('active');
        btn.classList.add('active');
        filter = btn.dataset.filter;
        render();
      });
    });

    // ── Persist ──
    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // ── Render ──
    function render() {
      const filtered = tasks.filter(t => {
        if (filter === 'active')    return !t.done;
        if (filter === 'completed') return  t.done;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="icon">${filter === 'completed' ? '🎉' : '🌤️'}</div>
            <p>${
              filter === 'completed'
                ? 'No completed tasks yet.'
                : filter === 'active'
                  ? 'All caught up — nice!'
                  : 'Add your first task above!'
            }</p>
          </div>`;
      } else {
        list.innerHTML = filtered.map(t => `
          <li class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" />
            <span class="task-text">${escapeHTML(t.text)}</span>
            <button class="delete-btn" onclick="deleteTask(${t.id})" title="Delete">✕</button>
          </li>
        `).join('');
      }

      // Stats
      const active    = tasks.filter(t => !t.done).length;
      const completed = tasks.filter(t =>  t.done).length;

      if (tasks.length === 0) {
        statsEl.innerHTML = '';
      } else {
        statsEl.innerHTML = `
          ${active} task${active !== 1 ? 's' : ''} remaining
          ${completed > 0 ? `<button class="clear-completed" onclick="clearCompleted()">Clear completed (${completed})</button>` : ''}
        `;
      }
    }

    // ── Escape HTML ──
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Init ──
    render();
  </script>
</body>
</html>
